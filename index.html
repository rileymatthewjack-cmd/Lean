<style>

<main id="app"></main><nav id="nav" aria-label="Main"></nav>
<script>
'use strict';
/* =====================================================================
   LEAN MATRIX
   A small daily check-in, and as many ways of looking at it as possible.
   One file, vanilla JS, works offline, no pictures, nothing to evolve.

   THE DAILY CHECK-IN (a few taps): plan meals (porridge, salad, salad), snacks, weight, how comfortable the day felt.
   Anything off-plan can still be counted in calories, so the plan isn't the only thing it understands.

   SECTIONS  1 Config · 2 Utilities · 3 State & day data · 4 Weight analytics · 5 Projections
             6 Body fat · 7 Joints (osteoarthritis) · 8 Comfort & break check · 9 Streaks
             10 Charts · 11 Views · 12 Actions · 13 Export/import · 14 Boot
   NOT MEDICAL ADVICE. The body-fat, joint and projection numbers are estimates from published population averages.
   ===================================================================== */

/* ---------------------------------------------------------------------
   1. CONFIG: every tunable number lives here
   --------------------------------------------------------------------- */
const APP = 'Lean Matrix', KEY = 'lean_v1';
const DEFAULT_PLAN = [
  { id: 'p_por', name: 'Porridge', sub: 'breakfast', icon: '🥣', kcal: 300 },
  { id: 'p_sal1', name: 'Salad', sub: 'lunch', icon: '🥗', kcal: 350 },
  { id: 'p_sal2', name: 'Salad', sub: 'dinner', icon: '🥗', kcal: 350 }
];
const DEFAULT_SNACK_KCAL = 150;
const ACTIVITY = [[1.2, 'Mostly sitting'], [1.375, 'Lightly active'], [1.55, 'Moderately active'], [1.725, 'Very active']];
const EMA = 0.1;                       // weight trend smoothing (the "Hacker's Diet" 10% rule)
const KCAL_PER_KG = 7700;              // rough planning figure
const BMI_UNDER = 18.5, BMI_OVER = 25, BMI_OBESE = 30;
const FLOOR = { m: 1500, f: 1200 };    // commonly used lower limits for unsupervised dieting. Editable in Settings.
const DEFICIT = 500;                   // default daily deficit used for the suggested calorie target
/* Published figures behind the joint numbers (see the Body tab for sources):
   - relative risk of developing knee osteoarthritis vs normal weight: overweight 2.45 (95% CI 1.88-3.20), obese 4.55 (2.90-7.13);
     +35% for every 5 BMI points (BMJ Open meta-analysis of prospective studies)
   - another meta-analysis (age 50+, onset of knee pain): overweight OR 1.98, obese OR 2.66
   - each 1 kg of weight lost = about 4 kg less force through the knee with every step (Messier 2005, older adults with knee OA) */
const OA = { over: { rr: 2.45, lo: 1.88, hi: 3.2 }, obese: { rr: 4.55, lo: 2.9, hi: 7.13 }, per5: 1.35, load: 4, alt: { over: 1.98, obese: 2.66 } };
/* Break check: when the numbers say it's time to ease off */
const BREAK = { lowComfort: 2, lowComfortDays: 2, window: 3, trendDrop: 0.7, avgLow: 3.0, lowKcalDays: 3, lowKcalOf: 5, lowKcalRun: 14, fastLossPct: 1.0, nearBmi: 1.5, longPlanDays: 28, snoozeDays: 7 };
const FAST_REGRESS = [14, 28];         // windows (days) for the weight-rate regressions

/* ---------------------------------------------------------------------
   2. UTILITIES
   --------------------------------------------------------------------- */
const $ = s => document.querySelector(s);
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const fmt = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const ds = o => { const d = new Date(); d.setDate(d.getDate() + o); return fmt(d); };
const sh = (dt, n) => { const d = new Date(dt + 'T12:00:00'); d.setDate(d.getDate() + n); return fmt(d); };
const dd = (a, b) => Math.round((new Date(b + 'T12:00:00') - new Date(a + 'T12:00:00')) / 864e5);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const nf = n => Math.round(n).toLocaleString('en-GB');
const f1 = n => (+n).toFixed(1), f2 = n => (+n).toFixed(2);
const sg = (n, dp = 1) => { const v = +(+n).toFixed(dp); return (v > 0 ? '+' : v < 0 ? '−' : '') + Math.abs(v).toFixed(dp); };
const pc = x => Math.round(x * 100);
const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;
const pretty = dt => new Date(dt + 'T12:00:00').toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' });
const prettyY = dt => new Date(dt + 'T12:00:00').toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
const shortD = dt => new Date(dt + 'T12:00:00').toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
const monthY = dt => new Date(dt + 'T12:00:00').toLocaleDateString('en-GB', { month: 'short', year: '2-digit' });
const mean = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : null;
const sd = a => { if (a.length < 2) return null; const m = mean(a); return Math.sqrt(a.reduce((s, x) => s + (x - m) * (x - m), 0) / (a.length - 1)); };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const monday = dt => { const d = new Date(dt + 'T12:00:00'); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return fmt(d); };
const bar = (v, cls) => `<div class="bar ${cls || ''}" role="progressbar" aria-valuenow="${pc(clamp(v, 0, 1))}" aria-valuemin="0" aria-valuemax="100"><i style="width:${clamp(v, 0, 1) * 100}%"></i></div>`;

/* ---------------------------------------------------------------------
   3. STATE + DAY DATA
   S = { v, p:{name,age,sex,heightCm,goalKg,activity,leanFrac,bf,steps,floor,target}, plan:[{id,name,sub,icon,kcal}], snackKcal,
         days:{ 'YYYY-MM-DD': { m:{planId:1}, sn:0, ex:[{n,k}], ko:null, w:null, c:null } }, created, lastExport, breakSnooze }
   w = weight kg, c = comfort 1-5, sn = snack count, ko = a whole-day calorie total you typed instead, ex = extra food
   --------------------------------------------------------------------- */
let S = null, V = 'today', TD = ds(0), MSG = '', RST = 0, DT = false, IMPQ = null, IMPERR = '', CSVT = '', DNOTE = '', SERR = '';
let _cache = {};
function save() { _cache = {}; try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { } }
function newState(p) {
  return { v: 1, p: Object.assign({ name: '', age: 30, sex: 'm', heightCm: 175, goalKg: 0, activity: 1.375, leanFrac: 0.25, bf: null, steps: 6000, floor: null, target: null }, p),
    plan: DEFAULT_PLAN.map(x => Object.assign({}, x)), snackKcal: DEFAULT_SNACK_KCAL, days: {}, created: ds(0), lastExport: null, breakSnooze: null };
}
function migrate(raw) {
  if (!raw || typeof raw !== 'object' || !raw.p) return null;
  const n0 = x => isFinite(+x) ? +x : 0, n = newState({ name: String(raw.p.name || '').slice(0, 24), age: clamp(Math.round(n0(raw.p.age)) || 30, 18, 110), sex: raw.p.sex === 'f' ? 'f' : 'm', heightCm: clamp(n0(raw.p.heightCm) || 175, 100, 230),
    goalKg: n0(raw.p.goalKg), activity: ACTIVITY.some(a => a[0] === +raw.p.activity) ? +raw.p.activity : 1.375, leanFrac: clamp(n0(raw.p.leanFrac) || 0.25, 0.05, 0.5),
    bf: raw.p.bf && n0(raw.p.bf.pct) > 0 ? { pct: n0(raw.p.bf.pct), kg: n0(raw.p.bf.kg) } : null, steps: clamp(Math.round(n0(raw.p.steps)) || 6000, 0, 40000), floor: raw.p.floor ? n0(raw.p.floor) : null, target: raw.p.target ? n0(raw.p.target) : null });
  n.created = raw.created || ds(0); n.lastExport = raw.lastExport || null; n.breakSnooze = raw.breakSnooze || null; n.snackKcal = clamp(n0(raw.snackKcal) || DEFAULT_SNACK_KCAL, 0, 2000);
  if (Array.isArray(raw.plan) && raw.plan.length) n.plan = raw.plan.filter(x => x && x.id && x.name).slice(0, 8).map(x => ({ id: String(x.id), name: String(x.name).slice(0, 20), sub: String(x.sub || '').slice(0, 14), icon: String(x.icon || '🍽️').slice(0, 4), kcal: clamp(n0(x.kcal), 0, 3000) }));
  Object.keys(raw.days && typeof raw.days === 'object' ? raw.days : {}).forEach(k => {
    const d = raw.days[k] || {}, ok = /^\d{4}-\d{2}-\d{2}$/.test(k); if (!ok) return;
    const day = { m: {}, sn: Math.max(0, Math.round(n0(d.sn))), ex: (Array.isArray(d.ex) ? d.ex : []).filter(e => e && n0(e.k) > 0).map(e => ({ n: String(e.n || 'Food').slice(0, 30), k: Math.round(n0(e.k)) })),
      ko: d.ko != null && d.ko !== '' && n0(d.ko) > 0 ? Math.round(n0(d.ko)) : null, w: d.w != null && d.w !== '' && n0(d.w) > 20 && n0(d.w) < 400 ? Math.round(n0(d.w) * 100) / 100 : null, c: d.c != null && n0(d.c) >= 1 && n0(d.c) <= 5 ? Math.round(n0(d.c)) : null };
    Object.keys(d.m && typeof d.m === 'object' ? d.m : {}).forEach(id => { if (d.m[id] && n.plan.some(p => p.id === id)) day.m[id] = 1; });
    n.days[k] = day;
  });
  return n;
}
function load() { try { return migrate(JSON.parse(localStorage.getItem(KEY))); } catch (e) { return null; } }
const dayOf = d => S.days[d] || (S.days[d] = { m: {}, sn: 0, ex: [], ko: null, w: null, c: null });
const foodLogged = d => { const x = S.days[d]; return !!(x && (Object.keys(x.m).length || x.sn > 0 || x.ex.length || x.ko != null)); };
const hasAny = d => { const x = S.days[d]; return !!(x && (foodLogged(d) || x.w != null || x.c != null)); };
function dayKcal(d) {
  const x = S.days[d]; if (!x) return 0; if (x.ko != null) return x.ko;
  return S.plan.reduce((s, p) => s + (x.m[p.id] ? p.kcal : 0), 0) + x.sn * S.snackKcal + x.ex.reduce((s, e) => s + e.k, 0);
}
const planDone = d => { const x = S.days[d]; return x ? S.plan.filter(p => x.m[p.id]).length : 0; };
const planFrac = d => S.plan.length ? planDone(d) / S.plan.length : 0;
const cOf = d => S.days[d] && S.days[d].c != null ? S.days[d].c : null;
const wOf = d => S.days[d] && S.days[d].w != null ? S.days[d].w : null;
const firstDate = () => { const k = Object.keys(S.days).filter(hasAny).sort(); return k.length && k[0] < S.created ? k[0] : S.created; };

/* profile maths */
const hM = () => S.p.heightCm / 100;
const bmiOf = w => w / (hM() * hM());
const wAtBmi = b => b * hM() * hM();
const bmr = w => 10 * w + 6.25 * S.p.heightCm - 5 * S.p.age + (S.p.sex === 'm' ? 5 : -161);   // Mifflin-St Jeor
const tdee = w => bmr(w) * S.p.activity;
const floorK = () => S.p.floor || FLOOR[S.p.sex];
const targetK = w => S.p.target || Math.max(floorK(), Math.round((tdee(w || latestKg() || 75) - DEFICIT) / 50) * 50);
const bmiCat = b => b < BMI_UNDER ? 'Underweight' : b < BMI_OVER ? 'Healthy range' : b < BMI_OBESE ? 'Overweight' : 'Obese';

/* ---------------------------------------------------------------------
   4. WEIGHT ANALYTICS
   --------------------------------------------------------------------- */
function WS() { return _cache.ws || (_cache.ws = Object.keys(S.days).filter(d => S.days[d].w != null).sort().map(d => ({ d, w: S.days[d].w }))); }
const latest = () => { const a = WS(); return a.length ? a[a.length - 1] : null; };
const latestKg = () => { const l = latest(); return l ? l.w : null; };
const startKg = () => { const a = WS(); return a.length ? a[0].w : null; };
/* mean weight over the n days ending at `end` (inclusive) */
function avgW(end, n) { const lo = sh(end, -(n - 1)); return mean(WS().filter(x => x.d >= lo && x.d <= end).map(x => x.w)); }
/* exponential trend, carried across days without a weigh-in */
function trendMap() {
  if (_cache.tm) return _cache.tm; const a = WS(), m = {}; if (!a.length) return (_cache.tm = m);
  const wm = Object.fromEntries(a.map(x => [x.d, x.w])); let t = a[0].w;
  for (let d = a[0].d, last = ds(0) > a[a.length - 1].d ? ds(0) : a[a.length - 1].d; d <= last; d = sh(d, 1)) { if (wm[d] != null && d !== a[0].d) t += EMA * (wm[d] - t); m[d] = t; }
  return (_cache.tm = m);
}
const trendNow = () => { const m = trendMap(), a = WS(); if (!a.length) return null; return m[ds(0)] != null ? m[ds(0)] : m[a[a.length - 1].d]; };
const trendAt = d => { const m = trendMap(); return m[d] != null ? m[d] : null; };
/* least-squares slope (kg/day) over the n days ending today. Needs enough points and spread. */
function regress(n, end) {
  end = end || ds(0); const lo = sh(end, -(n - 1)), pts = WS().filter(x => x.d >= lo && x.d <= end).map(x => ({ x: dd(lo, x.d), y: x.w }));
  if (pts.length < 4 || pts[pts.length - 1].x - pts[0].x < n * 0.5) return null;
  const mx = mean(pts.map(p => p.x)), my = mean(pts.map(p => p.y)); let sxx = 0, sxy = 0; pts.forEach(p => { sxx += (p.x - mx) ** 2; sxy += (p.x - mx) * (p.y - my); });
  if (!sxx) return null; const b = sxy / sxx, a = my - b * mx; let rss = 0; pts.forEach(p => { rss += (p.y - (a + b * p.x)) ** 2; });
  const se = pts.length > 2 ? Math.sqrt(rss / (pts.length - 2) / sxx) : null;
  return { b, se, n: pts.length, a, lo };
}
/* the rate we project with: 14-day regression if there is one, else 28-day */
const rateNow = () => { for (const n of FAST_REGRESS) { const r = regress(n); if (r) return Object.assign({ days: n }, r); } return null; };
/* per-day figures for every weigh-in: change on the previous weigh-in, and against the average of the 7 days before */
function wStats() {
  if (_cache.st) return _cache.st; const a = WS(), out = {};
  a.forEach((x, i) => {
    const prev = i ? a[i - 1] : null, gap = prev ? dd(prev.d, x.d) : null, lo = sh(x.d, -7), before = a.filter(y => y.d >= lo && y.d < x.d).map(y => y.w);
    out[x.d] = { w: x.w, dPrev: prev && gap <= 4 ? x.w - prev.w : null, gap, dAvg7: before.length >= 3 ? x.w - mean(before) : null };
  });
  return (_cache.st = out);
}
/* a weigh-in "is down" if it's under the previous one, "below 7" if it's under the average of the 7 days before */
const isDown = d => { const s = wStats()[d]; return !!(s && s.dPrev != null && s.dPrev < 0); };
